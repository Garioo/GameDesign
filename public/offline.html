<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f1e9"><title>Offline · Foundry</title>
<style>html{background:#f6f1e9;color:#2a241e;font:17px/1.6 system-ui}body{margin:0;min-height:100dvh;display:grid;place-items:center}main{max-width:28rem;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}h1{font-size:2rem;line-height:1.2}button,a{display:inline-block;padding:12px 18px;border-radius:8px;font:inherit}button{background:#bb5b24;color:white;border:0;cursor:pointer}a{color:#a8521f}button:focus-visible,a:focus-visible{outline:3px solid #2a241e;outline-offset:4px}</style></head>
<body><main><h1>You're offline</h1><p>Foundry needs a connection to load your workspace. Reconnect, then try again.</p><p>If you have unsaved work open in another window, keep it open until it finishes saving.</p><button onclick="location.reload()">Try again</button><a href="/home">Go to home</a><p id="status" role="status"></p></main><script>window.addEventListener('online',function(){document.getElementById('status').textContent='Your connection is back. Tap Try again to continue.';});</script></body></html>
